services:
  app:
    build:
      context: ./laravel
      target: runtime
    image: naminiel-art:latest
    container_name: naminiel-art
    restart: unless-stopped
    env_file:
      - ./laravel/.env.production
    volumes:
      - naminiel_data:/data
      - naminiel_storage:/var/www/html/storage
    ports:
      - "80:80"

volumes:
  naminiel_data:
  naminiel_storage:
