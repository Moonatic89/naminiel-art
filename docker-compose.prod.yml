services:
  app:
    build:
      context: .
      target: runtime
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: naminiel-art:latest
    container_name: naminiel-art
    restart: unless-stopped
    env_file:
      - ./.env.production
    volumes:
      - naminiel_data:/data
      - naminiel_storage:/var/www/html/storage
    ports:
      - "80:80"

volumes:
  naminiel_data:
  naminiel_storage:
